name: Release Life-Poker

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号 (例如 v0.0.4)'
        required: true
        default: 'v0.0.4'
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Signing Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from GitHub Secrets"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'lifepoker123' }}" > android/key.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || 'lifepoker123' }}" >> android/key.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS || 'lifepoker' }}" >> android/key.properties
            echo "storeFile=release.keystore" >> android/key.properties
          else
            echo "Using persistent release keystore from repository"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/life-poker-android-${{ env.RELEASE_TAG }}.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/life-poker-android-${{ env.RELEASE_TAG }}.apk

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "release-assets\life-poker-windows-${{ env.RELEASE_TAG }}.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release-assets/life-poker-windows-${{ env.RELEASE_TAG }}.zip

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Package Web App
        run: |
          mkdir -p release-assets
          cd build/web && zip -r ../../release-assets/life-poker-web-${{ env.RELEASE_TAG }}.zip .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: release-assets/life-poker-web-${{ env.RELEASE_TAG }}.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List Release Files
        run: ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
