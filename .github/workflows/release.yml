name: Release Life-Poker

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本标签（选填，直接留空则根据项目版本自动发布）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare-version:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.get_version.outputs.tag }}
      release_name: ${{ steps.get_version.outputs.name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            PUBSPEC_VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d '+' -f 1 | tr -d '\r\n ')
            if [ -z "$PUBSPEC_VER" ]; then
              PUBSPEC_VER="0.0.4"
            fi
            if git rev-parse "v$PUBSPEC_VER" >/dev/null 2>&1; then
              TAG="v$PUBSPEC_VER-build.${{ github.run_number }}"
            else
              TAG="v$PUBSPEC_VER"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=Release $TAG" >> $GITHUB_OUTPUT
          echo "Determined release tag: $TAG"

  build-android:
    name: Build Android APK
    needs: [prepare-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Signing Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from GitHub Secrets"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'lifepoker123' }}" > android/key.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || 'lifepoker123' }}" >> android/key.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS || 'lifepoker' }}" >> android/key.properties
            echo "storeFile=release.keystore" >> android/key.properties
          else
            echo "Using persistent release keystore from repository"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/life-poker-android-${{ needs.prepare-version.outputs.release_tag }}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/life-poker-android-${{ needs.prepare-version.outputs.release_tag }}.apk

  build-windows:
    name: Build Windows Desktop
    needs: [prepare-version]
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "release-assets\life-poker-windows-${{ needs.prepare-version.outputs.release_tag }}.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release-assets/life-poker-windows-${{ needs.prepare-version.outputs.release_tag }}.zip

  build-web:
    name: Build Web App
    needs: [prepare-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Package Web App
        run: |
          mkdir -p release-assets
          cd build/web && zip -r "../../release-assets/life-poker-web-${{ needs.prepare-version.outputs.release_tag }}.zip" .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: release-assets/life-poker-web-${{ needs.prepare-version.outputs.release_tag }}.zip

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-version, build-android, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List Release Files
        run: ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare-version.outputs.release_name }}
          tag_name: ${{ needs.prepare-version.outputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
